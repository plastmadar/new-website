<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع قيد الصيانه والتدشين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.6rem;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .contact-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            text-align: right;
        }
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: #475569;
            font-size: 0.95rem;
            text-decoration: none;
        }
        .contact-item:last-child { margin-bottom: 0; }
        .contact-item strong { margin-left: 8px; color: #1e293b; }
    </style>
</head>
<body>

    <div class="container">
        <!-- استبدل logo.png برابط أو مسار شعار شركتك -->
        <img src="logo.png" alt="شعار الشركة" class="logo">
        
        <h1>الموقع قيد التطوير والتدشين</h1>
        <p>نعمل حالياً على تجهيز موقعنا الإلكتروني لخدمتكم بشكل أفضل. يمكنك التواصل معنا عبر الوسائل التالية:</p>

        <div class="contact-box">
            <a href="tel:+96700000000" class="contact-item">
                <strong>الهاتف:</strong> 00000000 967+
            </a>
            <a href="https://wa.me/96700000000" class="contact-item" target="_blank">
                <strong>واتساب:</strong> تواصل معنا مباشرة
            </a>
            <a href="mailto:info@yourdomain.com" class="contact-item">
                <strong>البريد:</strong> info@yourdomain.com
            </a>
        </div>
    </div>

</body>
</html>
